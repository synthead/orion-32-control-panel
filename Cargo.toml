[package]
name = "orion-32-control-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
env_logger = { version = "0.11.11", features = ["auto-color", "humantime"] }
hidapi = "2.6.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde-pickle = "1.2.0"
serde_json = "1.0.154"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
